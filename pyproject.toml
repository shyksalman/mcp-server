[project]
name = "enigmatix-oms-assistant"
version = "0.1.0"
description = "Local Ollama assistant for personal Enigmatix OMS data via MCP"
requires-python = ">=3.11"
dependencies = ["mcp>=1.10,<2", "ollama>=0.5,<1", "httpx>=0.27,<1", "pydantic>=2,<3", "pydantic-settings>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oms_mcp", "src/assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
